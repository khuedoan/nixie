[package]
name = "proxydhcp-snooper"
version = "0.1.0"
edition = "2021"
description = "Prototype passive Linux ProxyDHCP/PXE snooper, mirroring Nixie's Go pixiecore fork"
license = "Apache-2.0"

[dependencies]
dhcproto = "0.15"

[dev-dependencies]
dhcproto = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
